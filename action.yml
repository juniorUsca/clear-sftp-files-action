name: 'Clear sftp files'
description: 'Download a list of files separated by comma from a remote SFTP server'
inputs:
  host:
    description: 'SFTP host'
    required: true
  port:
    description: 'SFTP port'
    default: '22'
  username:
    description: 'SFTP username'
    required: true
  password:
    description: 'SFTP password'
    required: true
  file-patterns:
    description: 'File patterns separated by comma'
    required: true
  remote-dir-path:
    description: 'Remote directory path'
    required: true
  artifact-name:
    description: 'Artifact name'
    default: 'cleared-files'
  fail-if-no-files:
    description: 'Fail if no files are found. Default ''false''. To activate set to ''true'''
    default: 'false'
runs:
  using: 'node20'
  main: 'dist/index.js'
outputs:
  file-names:
    description: 'Array of file names that were cleared'